# GitLab CI/CD for Rockchip RK3506 SDK

stages:
  - build

variables:
  GIT_CLONE_PATH: "/home/gitlab-runner/builds/rk3506_linux"
  MANIFEST_XML: "rk3506_linux_release_v1.2.0.xml"
  CCACHE_DIR: "/var/cache/rk-ci/ccache"
  BUILDROOT_DL_DIR: "/var/cache/rk-ci/buildroot-dl"
  GIT_STRATEGY: none


build-rk3506:
  stage: build
  tags:
    - rk3506
    - shell
  script:
    - bash .gitlab/ci-build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-rk3506"'
  timeout: 8h

